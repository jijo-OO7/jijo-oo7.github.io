<!DOCTYPE html>
<html lang="en">

<head>
  <!-- =====================================================
       1. PAGE METADATA
       ===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6226fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CV Manager">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <title>CV Manager</title>

  <!-- =====================================================
       2. DASHBOARD STYLES
       Dark theme, request cards, buttons and mobile layout
       ===================================================== -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0b1120;
      color: #e5e7eb;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    .panel {
      background: #151e30;
      border: 1px solid #293449;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    .muted {
      color: #9ca3af;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 14px;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #0b1120;
      color: white;
    }

    button {
      border: 0;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .primary {
      background: #60a5fa;
      color: #07111f;
    }

    .approve {
      background: #166534;
      color: white;
    }

    .reject {
      background: #991b1b;
      color: white;
    }

    .secondary {
      background: #374151;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    /* Dashboard summary counters */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 20px 0;
    }

    .stat {
      background: #0b1120;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #293449;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
    }

    /* Dashboard toolbars and filters */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .filters button.active {
      background: #2563eb;
      color: white;
    }

    /* Individual recruiter request cards */
    .request {
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 18px;
      margin: 12px 0;
      background: #101827;
    }

    .request h3 {
      margin: 0 0 8px;
    }

    .request p {
      margin: 7px 0;
      overflow-wrap: anywhere;
    }

    /* Request status indicators */
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      background: #374151;
      margin: 8px 0;
    }

    .status.pending {
      background: #854d0e;
    }

    .status.approved {
      background: #166534;
    }

    .status.rejected {
      background: #991b1b;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    #message {
      margin-top: 12px;
      color: #fbbf24;
    }

    /* Responsive layout for mobile devices */
    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
      }

      .panel {
        padding: 17px;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        padding: 12px;
      }

      .stat strong {
        font-size: 22px;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- ===================================================
         3. ADMIN LOGIN PANEL
         Only the administrator should be able to access
         the dashboard.
         =================================================== -->
    <section
      id="loginPanel"
      class="panel"
      style="max-width:420px;margin:70px auto"
    >
      <h1>CV Access</h1>
      <p class="muted">Private administrator dashboard</p>

      <form id="loginForm">

        <label for="email">Admin email</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="username"
          value="sumanmandal.dev@gmail.com"
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        >

        <button
          class="primary"
          type="submit"
          style="width:100%"
        >
          Sign in
        </button>

      </form>

      <p id="message" role="status"></p>
    </section>


    <!-- ===================================================
         4. ADMIN DASHBOARD
         Hidden until successful administrator login.
         =================================================== -->
    <section id="dashboard" class="hidden">

      <!-- Dashboard header and summary -->
      <div class="panel">

        <div class="toolbar">

          <div>
            <h1>CV Access Dashboard</h1>
            <p class="muted">Manage recruiter requests</p>
          </div>

          <button id="logoutButton" class="secondary">
            Sign out
          </button>

        </div>

        <!-- Request statistics -->
        <div class="stats">

          <div class="stat">
            Pending
            <strong id="pendingCount">0</strong>
          </div>

          <div class="stat">
            Approved
            <strong id="approvedCount">0</strong>
          </div>

          <div class="stat">
            Rejected
            <strong id="rejectedCount">0</strong>
          </div>

        </div>
      </div>


      <!-- Recruiter request management -->
      <div class="panel">

        <div class="toolbar">
          <h2>Requests</h2>

          <button id="refreshButton" class="secondary">
            Refresh
          </button>
        </div>

        <!-- Filter requests by status -->
        <div class="filters">

          <button class="secondary active" data-filter="all">
            All
          </button>

          <button class="secondary" data-filter="pending">
            Pending
          </button>

          <button class="secondary" data-filter="approved">
            Approved
          </button>

          <button class="secondary" data-filter="rejected">
            Rejected
          </button>

        </div>

        <p id="requestMessage" class="muted">
          Loading requests...
        </p>

        <!-- JavaScript renders recruiter cards here -->
        <div id="requestList"></div>

      </div>
    </section>

  </main>


  <!-- =====================================================
       5. DASHBOARD APPLICATION LOGIC
       Supabase authentication, database queries and
       Edge Function integration.
       ===================================================== -->
  <script type="module">

    // -----------------------------------------------------
    // 5.1 Import Supabase JavaScript client
    // -----------------------------------------------------
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // -----------------------------------------------------
    // 5.2 Supabase project configuration
    // The publishable key is intended for frontend use.
    // Database access is protected by Row Level Security.
    // Never put the Supabase secret key here.
    // -----------------------------------------------------
    const SUPABASE_URL =
      "https://dwltwuycvszpeyzrhaar.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_5EMeiHt8dUeq53ZPKhTZtg_9pezkhjO";


    // Create Supabase client
    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // -----------------------------------------------------
    // 5.3 Common DOM helper and dashboard state
    // -----------------------------------------------------
    const $ = (id) => document.getElementById(id);

    let requests = [];
    let currentFilter = "all";


    // -----------------------------------------------------
    // 5.4 Display login messages
    // -----------------------------------------------------
    function showMessage(message) {
      $("message").textContent = message;
    }


    // -----------------------------------------------------
    // 5.5 Show dashboard after successful login
    // -----------------------------------------------------
    function showDashboard() {
      $("loginPanel").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
    }


    // -----------------------------------------------------
    // 5.6 Show login screen after signing out
    // -----------------------------------------------------
    function showLogin() {
      $("dashboard").classList.add("hidden");
      $("loginPanel").classList.remove("hidden");
    }


    // -----------------------------------------------------
    // 5.7 LOAD REQUESTS
    // Fetch recruiter requests from Supabase.
    // RLS ensures only the administrator can read them.
    // -----------------------------------------------------
    async function loadRequests() {

      $("requestMessage").textContent = "Loading requests...";

      const { data, error } = await supabase
        .from("cv_requests")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        $("requestMessage").textContent = error.message;
        return;
      }

      requests = data || [];

      // Update dashboard statistics
      $("pendingCount").textContent =
        requests.filter(r => r.status === "pending").length;

      $("approvedCount").textContent =
        requests.filter(r => r.status === "approved").length;

      $("rejectedCount").textContent =
        requests.filter(r => r.status === "rejected").length;

      // Display the filtered request cards
      renderRequests();
    }


    // -----------------------------------------------------
    // 5.8 RENDER REQUEST CARDS
    // Display recruiter details, company, email, purpose,
    // submission date and current request status.
    // -----------------------------------------------------
    function renderRequests() {

      const filtered = requests.filter(r =>
        currentFilter === "all" || r.status === currentFilter
      );

      $("requestList").replaceChildren();

      $("requestMessage").textContent =
        filtered.length
          ? `${filtered.length} request(s)`
          : "No requests found.";

      filtered.forEach(r => {

        const card = document.createElement("article");
        card.className = "request";

        // Recruiter name
        const title = document.createElement("h3");
        title.textContent = r.full_name;

        // Company and job title
        const company = document.createElement("p");
        company.textContent =
          `${r.company}${r.job_title ? " · " + r.job_title : ""}`;

        // Recruiter email
        const email = document.createElement("p");
        email.textContent = r.email;

        // Reason for requesting the CV
        const purpose = document.createElement("p");
        purpose.textContent = r.purpose;

        // Request submission timestamp
        const date = document.createElement("p");
        date.className = "muted";
        date.textContent = new Date(r.created_at).toLocaleString();

        // Request status badge
        const status = document.createElement("span");
        status.className = `status ${r.status}`;
        status.textContent = r.status.toUpperCase();

        card.append(
          title,
          company,
          email,
          purpose,
          date,
          status
        );


        // -------------------------------------------------
        // 5.8.1 APPROVE / REJECT BUTTONS
        // Buttons appear only for pending requests.
        // -------------------------------------------------
        if (r.status === "pending") {

          const actions = document.createElement("div");
          actions.className = "actions";

          const approve = document.createElement("button");
          approve.className = "approve";
          approve.textContent = "Approve";

          const reject = document.createElement("button");
          reject.className = "reject";
          reject.textContent = "Reject";

          // Approve request
          approve.addEventListener("click", () =>
            updateStatus(r.id, "approved", approve, reject)
          );

          // Reject request
          reject.addEventListener("click", () =>
            updateStatus(r.id, "rejected", approve, reject)
          );

          actions.append(approve, reject);
          card.append(actions);
        }

        $("requestList").append(card);
      });
    }


    // -----------------------------------------------------
    // 5.9 REVIEW REQUEST
    //
    // The browser calls the review-cv-request Edge Function.
    //
    // The Edge Function:
    //   1. Checks administrator authorization.
    //   2. Checks that the request is still pending.
    //   3. Updates the request status.
    //   4. Generates a 48-hour CV signed URL on approval.
    //   5. Sends the CV access email.
    // -----------------------------------------------------
    async function updateStatus(id, status, ...buttons) {

      const confirmed = confirm(
        `Are you sure you want to ${status} this request?`
      );

      if (!confirmed) {
        return;
      }

      // Prevent multiple clicks while processing
      buttons.forEach(button => {
        button.disabled = true;
      });

      // Call the Supabase Edge Function.
      // Supabase client sends the logged-in user's session.
      const { data, error } = await supabase.functions.invoke(
        "review-cv-request",
        {
          body: {
            request_id: id,
            status: status
          }
        }
      );

      // Handle function/network errors
      if (error) {
        console.error("Review function error:", error);

        alert(
          `Could not review request: ${error.message}`
        );

        buttons.forEach(button => {
          button.disabled = false;
        });

        return;
      }

      // Handle application errors returned by the function
      if (data?.error) {

        alert(data.error);

        buttons.forEach(button => {
          button.disabled = false;
        });

        return;
      }

      // Display the actual result returned by the Edge Function.
      if (status === "approved") {

        if (data.email_sent === true) {

          alert(
            "Request approved successfully!\n\n" +
            "CV access email has been sent to the recruiter.\n\n" +
            "The CV link expires in 48 hours."
          );

        } else {

          alert(
            "Request approved, but email delivery failed.\n\n" +
            "Please check Supabase Edge Function logs."
          );

        }

      } else {

        alert("Request rejected successfully.");
      }

      // Refresh cards and counters
      await loadRequests();
    }


    // -----------------------------------------------------
    // 5.10 ADMIN LOGIN
    // Authenticate administrator using Supabase Auth.
    // -----------------------------------------------------
    $("loginForm").addEventListener("submit", async (event) => {

      event.preventDefault();

      showMessage("Signing in...");

      const { error } = await supabase.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) {
        showMessage(error.message);
        return;
      }

      showMessage("");

      showDashboard();

      await loadRequests();
    });


    // -----------------------------------------------------
    // 5.11 ADMIN LOGOUT
    // End the current Supabase session.
    // -----------------------------------------------------
    $("logoutButton").addEventListener("click", async () => {

      await supabase.auth.signOut();

      showLogin();
    });


    // -----------------------------------------------------
    // 5.12 REFRESH BUTTON
    // Manually fetch the latest recruiter requests.
    // -----------------------------------------------------
    $("refreshButton").addEventListener("click", loadRequests);


    // -----------------------------------------------------
    // 5.13 REQUEST FILTERS
    // Switch between all, pending, approved and rejected.
    // -----------------------------------------------------
    document.querySelectorAll("[data-filter]").forEach(button => {

      button.addEventListener("click", () => {

        currentFilter = button.dataset.filter;

        // Highlight the selected filter
        document.querySelectorAll("[data-filter]").forEach(item => {
          item.classList.toggle("active", item === button);
        });

        renderRequests();
      });
    });


    // -----------------------------------------------------
    // 5.14 SESSION RESTORATION
    // If an administrator already has an active session,
    // show the dashboard without requiring another login.
    // -----------------------------------------------------
    const {
      data: { session }
    } = await supabase.auth.getSession();

    if (session) {

      showDashboard();

      await loadRequests();
    }

  </script>

  <!-- CV Manager PWA service worker registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register("/sw.js");

          console.log(
            "CV Manager service worker registered:",
            registration.scope
          );
        } catch (error) {
          console.error(
            "CV Manager service worker registration failed:",
            error
          );
        }
      });
    }
  </script>

</body>
</html>
